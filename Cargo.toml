[workspace]
members = [
    "crates/stochastic-core",
    "crates/stochastic-frequentist",
    "crates/stochastic-bayesian",
    "crates/stochastic-ergodic",
    "crates/stochastic-equilibrium",
    "crates/stochastic-galois",
    "crates/stochastic-fractal",
    "crates/stochastic-chaos",
    "crates/stochastic-information",
    "crates/stochastic-normalization",
    "crates/stochastic-topology",
    "crates/stochastic-spectral",
    "crates/stochastic-network",
    "crates/stochastic-quantum",
    "crates/stochastic-optimization",
    "cli",
    "gui",
]

[workspace.package]
version = "1.0.0"
authors = ["Francisco Molina <pako.molina@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Yatrogenesis/STOCHASTIC-Framework"
keywords = ["stochastic", "analysis", "time-series", "statistics", "chaos"]
categories = ["science", "mathematics", "algorithms"]

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"

# Math libraries
nalgebra = "0.33"
ndarray = "0.16"
ndarray-stats = "0.6"
statrs = "0.17"
num-traits = "0.2"
num-complex = "0.4"
special = "0.11"

# FFT and signal processing
rustfft = "6.2"
realfft = "3.3"

# Graph/network
petgraph = "0.6"

# Random numbers
rand = "0.8"
rand_distr = "0.4"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Parallel processing
rayon = "1.10"

# CLI
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"

# GUI
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
egui_plot = "0.29"

# File I/O
csv = "1.3"
calamine = "0.25"

# Logging
log = "0.4"
env_logger = "0.11"

# Testing
criterion = "0.5"
proptest = "1.5"
approx = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
